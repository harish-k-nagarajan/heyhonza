# Backup ticker. Production check-ins are scheduled in Supabase with pg_cron
# (every minute → POST /api/cron/check-ins). This workflow stays off unless
# that job is down: it needs repo secret CRON_SECRET, and a private repo
# bills one GitHub minute per run.
# Optional CHECK_INS_URL (defaults to the production heyhonza app).
name: Daily check-ins

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger check-ins
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECK_INS_URL: ${{ secrets.CHECK_INS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Set repository secret CRON_SECRET (same value as the Vercel env var)."
            exit 1
          fi
          url="${CHECK_INS_URL:-https://heyhonza.vercel.app/api/cron/check-ins}"
          curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url"
