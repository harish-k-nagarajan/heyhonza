# Backup ticker. Production check-ins are scheduled in Supabase with pg_cron
# (every minute → POST /api/cron/check-ins). This workflow stays off unless
# that job is down. It needs repository secrets CRON_SECRET and CHECK_INS_URL.
name: Daily check-ins

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger check-ins
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECK_INS_URL: ${{ secrets.CHECK_INS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Set repository secret CRON_SECRET (same value as the server env var)."
            exit 1
          fi
          if [ -z "${CHECK_INS_URL:-}" ]; then
            echo "Set repository secret CHECK_INS_URL to your deployment's /api/cron/check-ins route."
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$CHECK_INS_URL"
